
 name: Supabase CI/CD & Schema Sync

    on:
      push:
        branches:
          - main
        paths:
          - "supabase/**"
          - ".github/workflows/supabase-deploy.yml"
      pull_request:
        branches:
          - main
        paths:
          - "supabase/**"
          - ".github/workflows/supabase-deploy.yml"
      workflow_dispatch:

    concurrency:
      group: supabase-deploy-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

    permissions:
      contents: write
      pull-requests: read

    jobs:
      validate-migrations-and-rls:
        name: Validate Migrations, Drift & 100% RLS
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Setup Supabase CLI
            uses: supabase/setup-cli@v1
            with:
              version: latest

          - name: Start isolated local Supabase stack
            run: |
              supabase start \
                --exclude studio,inbucket,imgproxy,edge-runtime,logflare,vector,supavisor

          - name: Replay all migrations from scratch
            run: supabase db reset --no-seed

          - name: Enforce 100% RLS coverage across public schema
            run: |
              UNPROTECTED=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc \
                "SELECT string_agg(tablename, ', ') FROM pg_tables WHERE schemaname = 'public' AND rowsecurity =
                false;")

              if [ -n "$UNPROTECTED" ]; then
                echo "::error::Row Level Security (RLS) is DISABLED on public table(s): $UNPROTECTED"
                exit 1
              fi
              echo "✅ Verified: 100% of public tables have Row Level Security enabled."

          - name: Verify privileged RPCs are revoked from PUBLIC/anon/authenticated
            run: |
              LEAKED=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc \
                "SELECT string_agg(routine_name, ', ') FROM information_schema.role_routine_grants WHERE
                routine_schema = 'public' AND routine_name IN ('reconcile_clickpesa_payment',
                'upsert_live_mineral_spot') AND grantee IN ('PUBLIC', 'anon', 'authenticated');")

              if [ -n "$LEAKED" ]; then
                echo "::error::Privileged SECURITY DEFINER RPC(s) exposed to client roles: $LEAKED"
                exit 1
              fi
              echo "✅ Verified: Privileged RPCs are strictly restricted to service_role."

          - name: Check for uncommitted migration drift
            run: |
              DIFF_OUTPUT=$(supabase db diff --local)
              if [ -n "$DIFF_OUTPUT" ]; then
                echo "::error::Schema drift detected! Generate a migration before merging."
                echo "$DIFF_OUTPUT"
                exit 1
              fi
              echo "✅ Verified: Zero schema drift."

          - name: Stop local Supabase stack
            if: always()
            run: supabase stop --no-backup

      deploy-production:
        name: Deploy Migrations & Sync TypeScript Types
        needs: validate-migrations-and-rls
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name ==
        'workflow_dispatch')
        runs-on: ubuntu-latest
        environment: production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4
            with:
              fetch-depth: 0

          - name: Setup Supabase CLI
            uses: supabase/setup-cli@v1
            with:
              version: latest

          - name: Link to production Supabase project
            run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

          - name: Dry-run pending migrations against production
            run: supabase db push --dry-run

          - name: Push pending migrations to production
            run: supabase db push

          - name: Deploy Supabase Edge Functions (if present)
            run: |
              if [ -d "supabase/functions" ] && [ -n "$(find supabase/functions -mindepth 1 -maxdepth 1 -type d !
              -name '_shared')" ]; then
                supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
              else
                echo "No Edge Functions found in supabase/functions — skipping."
              fi

          - name: Regenerate TypeScript types from live schema
            run: |
              mkdir -p types
              supabase gen types typescript --linked > types/supabase.ts

          - name: Commit updated types/supabase.ts if changed
            run: |
              if git diff --quiet types/supabase.ts; then
                echo "types/supabase.ts is already in lockstep with live database."
                exit 0
              fi

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add types/supabase.ts
              git commit -m "chore(types): sync Supabase TypeScript schema definitions [skip ci]"
              git push origin HEAD:main
