name: Supabase CI/CD & Schema Sync

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  pull-requests: read

jobs:
  validate-migrations-and-rls:
    name: Validate Migrations, Drift & 100% RLS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.22.6

      - name: Start isolated local Supabase stack
        run: >
          supabase start --exclude
          studio,inbucket,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Verify clean migration execution & idempotency
        run: supabase db reset

      - name: Check schema drift between migrations and live schema
        run: |
          supabase db diff --local --schema public > /tmp/drift.sql
          if [ -s /tmp/drift.sql ]; then
            echo "Schema drift detected:"
            cat /tmp/drift.sql
            exit 1
          fi

      - name: Enforce 100% Row-Level Security (RLS) on public tables
        run: |
          DB_URL=$(supabase status --output json | jq -r '.DB_URL')
          UNPROTECTED=$(psql "$DB_URL" -Atc "
            SELECT string_agg(c.relname, ', ')
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
              AND c.relkind = 'r'
              AND NOT c.relrowsecurity;
          ")
          if [ -n "$UNPROTECTED" ]; then
            echo "Tables missing RLS: $UNPROTECTED"
            exit 1
          fi

  deploy-migrations:
    name: Deploy Migrations & Sync TypeScript Types
    needs: validate-migrations-and-rls
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.22.6

      - name: Link to production Supabase project
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Dry-run pending migrations against production
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --remote --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Push pending migrations to production
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Supabase Edge Functions (if present)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -d "supabase/functions" ] && [ -n "$(ls -A supabase/functions 2>/dev/null)" ]; then
            supabase functions deploy --no-verify-jwt
          fi

      - name: Regenerate TypeScript types from live schema
        run: |
          mkdir -p types
          supabase gen types typescript --linked > types/supabase.ts

      - name: Commit updated types/supabase.ts if changed
        run: |
          if [ -n "$(git status --porcelain types/supabase.ts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add types/supabase.ts
            git commit -m "chore(db): sync generated Supabase TypeScript types"
            git push
          fi
