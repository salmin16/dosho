    name: Supabase CI/CD & Schema Sync

    on:
      push:
        branches:
          - main
        paths:
          - "supabase/**"
          - ".github/workflows/supabase-deploy.yml"
      pull_request:
        branches:
          - main
        paths:
          - "supabase/**"
          - ".github/workflows/supabase-deploy.yml"
      workflow_dispatch:

    concurrency:
      group: supabase-deploy-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

    permissions:
      contents: write
      pull-requests: read

    jobs:
      validate-migrations-and-rls:
        name: Validate Migrations, Drift & 100% RLS
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Setup Supabase CLI
            uses: supabase/setup-cli@v1
            with:
              version: latest

          - name: Start isolated local Supabase stack
            run: >
              supabase start --exclude
              studio,inbucket,imgproxy,edge-runtime,logflare,vector,supavisor

          - name: Replay all migrations from scratch
            run: supabase db reset --no-seed

          - name: Enforce 100% RLS coverage across public schema
            run: |
              DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
              SQL="SELECT string_agg(tablename, ', ') FROM pg_tables
                   WHERE schemaname = 'public' AND rowsecurity = false;"
              UNPROTECTED=$(psql "$DB" -tAc "$SQL")
              if [ -n "$UNPROTECTED" ]; then
                echo "::error::RLS DISABLED on: $UNPROTECTED"
                exit 1
              fi
              echo "Verified: 100% of public tables have RLS enabled."

          - name: Verify privileged RPCs are revoked from client roles
            run: |
              DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
              SQL="SELECT string_agg(routine_name, ', ')
                   FROM information_schema.role_routine_grants
                   WHERE routine_schema = 'public'
                     AND routine_name IN (
                       'reconcile_clickpesa_payment',
                       'upsert_live_mineral_spot'
                     )
                     AND grantee IN ('PUBLIC', 'anon', 'authenticated');"
              LEAKED=$(psql "$DB" -tAc "$SQL")
              if [ -n "$LEAKED" ]; then
                echo "::error::Privileged RPC exposed: $LEAKED"
                exit 1
              fi
              echo "Verified: Privileged RPCs restricted to service_role."

          - name: Check for uncommitted migration drift
            run: |
              DIFF_OUTPUT=$(supabase db diff --local)
              if [ -n "$DIFF_OUTPUT" ]; then
                echo "::error::Schema drift detected!"
                echo "$DIFF_OUTPUT"
                exit 1
              fi
              echo "Verified: Zero schema drift."

          - name: Stop local Supabase stack
            if: always()
            run: supabase stop --no-backup

      deploy-production:
        name: Deploy Migrations & Sync TypeScript Types
        needs: validate-migrations-and-rls
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        environment: production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4
            with:
              fetch-depth: 0

          - name: Setup Supabase CLI
            uses: supabase/setup-cli@v1
            with:
              version: latest

          - name: Link to production Supabase project
            run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

          - - name: Dry-run pending migrations against production
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --remote --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Push pending migrations to production
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD"

          - name: Deploy Supabase Edge Functions (if present)
            run: |
              if [ -d "supabase/functions" ]; then
                FUNCS=$(find supabase/functions -mindepth 1 -maxdepth 1 \
                  -type d ! -name '_shared')
                if [ -n "$FUNCS" ]; then
                  supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
                fi
              fi

          - name: Regenerate TypeScript types from live schema
            run: |
              mkdir -p types
              supabase gen types typescript --linked > types/supabase.ts

          - name: Commit updated types/supabase.ts if changed
            run: |
              if git diff --quiet types/supabase.ts; then
                echo "types/supabase.ts is already up to date."
                exit 0
              fi
              git config user.name "github-actions[bot]"
              git config user.email \
                "41898282+github-actions[bot]@users.noreply.github.com"
              git add types/supabase.ts
              git commit -m "chore(types): sync Supabase types [skip ci]"
              git push origin HEAD:main
